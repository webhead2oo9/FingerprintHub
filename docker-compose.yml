# LOCAL DEVELOPMENT ONLY.
#
# Production runs against the host's native postgresql.service (one role+DB per
# service), NOT this container. This compose file only provides a disposable
# Postgres for local tests/validation, on a distinct port (54330) so it never
# collides with anything else on the box.
services:
  fingerprinthub-postgres:
    image: postgres:18-alpine
    container_name: fingerprinthub-postgres-dev
    environment:
      POSTGRES_USER: fingerprinthub
      POSTGRES_PASSWORD: fingerprinthub_dev
      POSTGRES_DB: fingerprinthub_dev
    ports:
      - "54330:5432"
    volumes:
      - fingerprinthub-postgres-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fingerprinthub -d fingerprinthub_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fingerprinthub-postgres-dev-data:
